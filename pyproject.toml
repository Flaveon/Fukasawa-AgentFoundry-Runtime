[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fukasawa-agentfoundry-runtime"
version = "0.1.0"
description = "Local-first workflow governance layer for human-agent collaboration under ConcordiaPax."
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "typer",
    "sqlite-utils",
    "rich",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fukasawa = "src.cli:app"

[tool.setuptools]
packages = ["src", "src.schemas", "src.runtime", "src.foundry", "src.governance", "src.kernel", "src.security"]

[tool.pytest.ini_options]
testpaths = ["tests"]
