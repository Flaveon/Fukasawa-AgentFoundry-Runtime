[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fukasawa-agentfoundry-runtime"
version = "0.1.0"
description = "Local-first workflow governance layer for human-agent collaboration under ConcordiaPax."
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "typer",
    "sqlite-utils",
    "rich",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
gui = ["customtkinter>=6"]
build = ["pyinstaller>=6", "customtkinter>=6"]

[project.scripts]
fukasawa = "src.cli:app"
fukasawa-gui = "src.gui.app:main"

[tool.setuptools.packages.find]
# Discovered rather than listed. The hand-written list silently omitted
# `src.gui.services` when phase 7 split that module into a package, so a
# `pip install .` built a wheel whose GUI could not import its own service
# layer — invisible to the test suite, which runs from the source tree, and to
# CI, which builds through a PyInstaller spec. `tests/test_packaging.py` holds
# the property; this makes forgetting impossible rather than merely detected.
include = ["src*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
