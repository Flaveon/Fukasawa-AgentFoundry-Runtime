# PILOT — Observed human workflow: ConcordiaPax Substack article production.
#
# This is stage 1 of the lifecycle: the process AS IT ACTUALLY HAPPENS, gaps
# and all. It is deliberately IMPERFECT. Do not "fix" this file — the defects
# are the fixtures. It seeds every problem the master handoff §10 names, and
# the validator rule set (HW-001..HW-016) is expected to find them:
#
#   1. an idea expands beyond article scope       -> scope-check step, no criteria (HW-014)
#   2. research/software becomes a hidden dep     -> deep-research step, unowned exception (HW-012)
#   3. publication ownership is implicit          -> publish step has no actor (HW-003)
#   4. "ready to publish" lacks criteria          -> ambiguous exit condition (HW-014)
#   5. artwork and distribution separate handoffs -> cross-actor handoff, no artifact (HW-008)
#   6. scope control requires a human gate        -> gate with no rejection path (HW-015)
#   7. AI can prepare but not authorize publish   -> characteristics force a safety floor
#
# It is also structurally broken on purpose: 'promote-post' is referenced but
# never defined (HW-005) and 'archive-notes' is defined but unreachable (HW-006).
#
# The derived artifacts (validation report, accountable workflow, cooperation
# assessment, cooperative workflow, workflow design brief) are produced by
# later phases and land beside this file.

schema_version: "1"
workflow_id: substack-publication
name: ConcordiaPax Substack Article Production
version: "1"
maturity: OBSERVED

purpose: >
  Turn a ConcordiaPax idea into a published Substack article with artwork and
  distribution, without losing scope control or publishing something nobody
  signed off on.

# Rule HW-001 is satisfied: the trigger is stated.
trigger: >
  An idea worth writing about surfaces — usually from a conversation, an
  incident at work, or a half-finished note in the backlog.

# Rule HW-002 is NOT satisfied in a useful way: this says what "done" looks
# like vaguely, with no criteria. HW-014 should flag "ready".
claimed_outcome: >
  The article is ready and goes out to subscribers.

actors:
  - operator          # writes, decides scope, owns the publication
  - research-helper   # gathers sources; sometimes becomes a whole side project
  - artwork           # produces the header image
  - substack          # the platform itself

systems:
  - Obsidian vault
  - Substack editor
  - image tooling

artifacts:
  - idea note
  - outline
  - draft
  - header image
  - published post

steps:
  # ---------------------------------------------------------------- capture
  - step_id: capture-idea
    name: Capture the idea
    description: >
      Write the idea into a note before it evaporates. Almost always happens
      in the middle of doing something else.
    actor: operator
    action: Write an idea note with the core claim and why it matters.
    trigger: An idea surfaces.
    inputs:
      - name: the thought itself
        source: operator
        required: true
    outputs:
      - name: idea note
        artifact_type: markdown note
        evidence_requirement: note exists in the vault with a title and a claim
    entry_condition: The idea has been said out loud or written down somewhere.
    exit_condition: A note exists with at least a claim and a reason it matters.
    decision_authority: operator
    next_steps:
      - scope-check
    characteristics:
      judgment_load: MODERATE
      repeatability: ROUTINE
      determinism: JUDGMENT_BASED
      risk: LOW
      reversibility: REVERSIBLE
      data_sensitivity: INTERNAL

  # ------------------------------------------------- seeded problem 1 and 6
  - step_id: scope-check
    name: Decide whether this is one article
    description: >
      The recurring failure: an idea that is really three articles, or really
      a software project wearing an article costume. This is where scope is
      supposed to be controlled, and the criteria live only in the operator's
      head.
    actor: operator
    action: Decide whether the idea fits one article, needs splitting, or is not an article at all.
    trigger: An idea note exists.
    preconditions:
      - The idea note has a stated claim.
    inputs:
      - name: idea note
        source: capture-idea
        required: true
    outputs:
      - name: scope decision
        artifact_type: ""            # HW-010: no artifact type
        evidence_requirement: ""     # HW-010: unverifiable output
    entry_condition: The operator has read the note again with fresh eyes.
    # HW-014: "feels like" is not a criterion.
    exit_condition: It feels like one coherent article.
    decision_authority: operator
    next_steps:
      - deep-research
      - draft-article
    exception_paths:
      - failure_mode: The idea is actually three articles.
        owner: operator
        handling: Split the note into separate idea notes and pick one.
        next_step: capture-idea
    characteristics:
      judgment_load: HIGH
      repeatability: ROUTINE
      determinism: JUDGMENT_BASED
      risk: MODERATE
      reversibility: REVERSIBLE
      data_sensitivity: INTERNAL

  # ------------------------------------------------------ seeded problem 2
  - step_id: deep-research
    name: Research the parts that need evidence
    description: >
      Sometimes a quick source check. Sometimes it turns into building a tool
      or reading a spec for two days — the hidden dependency that silently
      blows the schedule. Nobody owns the decision to stop.
    actor: research-helper
    action: Gather sources and verify claims that need support.
    trigger: The scope decision says evidence is needed.
    inputs:
      - name: idea note
        source: capture-idea
        required: true
      - name: open questions
        source: ""                   # HW-009: required input with no source
        required: true
    outputs:
      - name: source list
        artifact_type: markdown notes
        evidence_requirement: links or citations for each supported claim
    entry_condition: Open questions have been written down.
    exit_condition: Every claim that needs a source has one.
    decision_authority: operator
    next_steps:
      - draft-article
    exception_paths:
      # HW-012: this exception has no owner — the exact failure that eats weeks.
      - failure_mode: Research turns into a software or research project of its own.
        owner: ""
        handling: Unclear. Usually the article stalls until the operator notices.
    characteristics:
      judgment_load: MODERATE
      repeatability: OCCASIONAL
      determinism: MOSTLY_DETERMINISTIC
      risk: MODERATE
      reversibility: REVERSIBLE
      data_sensitivity: PUBLIC

  # ---------------------------------------------------------------- drafting
  - step_id: draft-article
    name: Write the draft
    actor: operator
    action: Write the article from the outline and sources.
    description: The actual writing, usually in two or three sittings.
    trigger: Scope is settled and any needed research exists.
    inputs:
      - name: idea note
        source: capture-idea
        required: true
      - name: source list
        source: deep-research
        required: false
    outputs:
      - name: draft
        artifact_type: markdown document
        evidence_requirement: draft file with a word count
    entry_condition: An outline or a strong opening exists.
    # HW-014: "ready" without criteria — seeded problem 4.
    exit_condition: The draft reads as ready.
    decision_authority: operator
    next_steps:
      - request-artwork
    characteristics:
      judgment_load: HIGH
      repeatability: ROUTINE
      determinism: JUDGMENT_BASED
      risk: LOW
      reversibility: REVERSIBLE
      data_sensitivity: INTERNAL

  # ------------------------------------------------------ seeded problem 5
  - step_id: request-artwork
    name: Get the header image
    description: >
      A separate handoff to whoever makes the artwork. In practice this is a
      message with no attached brief, and the reply is a file dropped
      somewhere — the handoff nobody wrote down.
    actor: operator
    action: Ask for a header image for the article.
    trigger: A draft exists that is close to final.
    inputs:
      - name: draft
        source: draft-article
        required: true
    # HW-008 / HW-010: hands off to a different actor with no artifact and no
    # evidence requirement.
    outputs:
      - name: artwork request
        artifact_type: ""
        evidence_requirement: ""
    entry_condition: The draft is stable enough to illustrate.
    exit_condition: Artwork has been asked for.
    decision_authority: operator
    next_steps:
      - review-and-approve
    characteristics:
      judgment_load: LOW
      repeatability: ROUTINE
      determinism: MOSTLY_DETERMINISTIC
      risk: LOW
      reversibility: REVERSIBLE
      data_sensitivity: PUBLIC

  # ------------------------------------------------ seeded problems 6 and 7
  - step_id: review-and-approve
    name: Final read and approval
    description: >
      The last human checkpoint before anything is public. Scope control and
      publication authority both really live here, even though the workflow
      never says so.
    actor: operator
    action: Read the draft end to end and decide whether it goes out.
    trigger: Draft and artwork are both in hand.
    inputs:
      - name: draft
        source: draft-article
        required: true
      - name: header image
        source: request-artwork
        required: false
    outputs:
      - name: approval decision
        artifact_type: decision
        evidence_requirement: a stated go/no-go with the reason
    entry_condition: The draft has been read once without editing.
    exit_condition: The operator has said yes or no.
    decision_authority: operator
    next_steps:
      - publish-post
    exception_paths:
      - failure_mode: The draft is not good enough yet.
        owner: operator
        handling: Send it back for another pass.
        next_step: draft-article
    characteristics:
      judgment_load: HIGH
      repeatability: ROUTINE
      determinism: JUDGMENT_BASED
      risk: HIGH
      reversibility: IRREVERSIBLE
      data_sensitivity: INTERNAL

  # ------------------------------------------------------ seeded problem 3
  - step_id: publish-post
    name: Publish to Substack
    description: >
      Paste into Substack, set the header image, send. Who actually owns this
      has never been written down — in practice whoever is at the keyboard.
    actor: ""                        # HW-003: implicit publication ownership
    action: Publish the post and send it to subscribers.
    trigger: The article was approved.
    inputs:
      - name: approved draft
        source: review-and-approve
        required: true
      - name: header image
        source: request-artwork
        required: true
    outputs:
      - name: published post
        artifact_type: substack post
        evidence_requirement: live post URL
    entry_condition: Approval has been given.
    exit_condition: The post is live and the email has gone out.
    decision_authority: ""           # HW-004: nobody named
    # HW-005: 'promote-post' is referenced but never defined below.
    next_steps:
      - promote-post
    exception_paths:
      - failure_mode: Substack rejects the formatting or the image.
        owner: operator
        handling: Fix the formatting and retry.
        next_step: publish-post
    characteristics:
      judgment_load: LOW
      repeatability: ROUTINE
      determinism: MOSTLY_DETERMINISTIC
      risk: HIGH
      reversibility: IRREVERSIBLE     # an email to subscribers cannot be unsent
      data_sensitivity: PUBLIC

  # ------------------------------------------- structurally unreachable step
  - step_id: archive-notes
    name: Archive the working notes
    description: >
      Meant to happen after publication, but nothing points here — in practice
      it only happens when the vault gets messy enough to notice.
    actor: operator
    action: Move working notes into the archive folder.
    trigger: The post is live.
    outputs:
      - name: archived notes
        artifact_type: folder
        evidence_requirement: notes present under the archive path
    entry_condition: The post is published.
    exit_condition: Working notes are out of the active folder.
    decision_authority: operator
    next_steps: []                   # terminal, and unreachable (HW-006)
    characteristics:
      judgment_load: NONE
      repeatability: ROUTINE
      determinism: DETERMINISTIC
      risk: LOW
      reversibility: REVERSIBLE
      data_sensitivity: INTERNAL

gates:
  # HW-015: an approval gate with no rejection path — seeded problem 6.
  - gate_id: publication-approval
    at_step: review-and-approve
    approver: operator
    criteria: ""                     # HW-014: no stated criteria
    on_approve: publish-post
    on_reject: ""                    # HW-015: nothing says what happens

observed_exceptions:
  - An idea turns out to be three articles.
  - Research becomes a software project and the article stalls.
  # HW-011: declared failure mode with no matching exception path anywhere.
  - Artwork never arrives and the post goes out with no header image.
  - Substack mangles the formatting on paste.

unwritten_rules:
  # HW-013 (non-blocking): recording these is honesty, not failure.
  - Never publish two long articles in the same week.
  - If the operator is unsure about a claim, cut it rather than hedge it.
  - Artwork is optional in practice, even though the workflow implies it is required.
  - The operator always does the final read on a real screen, never on a phone.

known_pain_points:
  - Scope creep is caught late, usually after the draft is half written.
  - Nobody notices research has become a side project until a week is gone.
  - '"Ready to publish" means something different on different days.'
  - Artwork and distribution are two separate conversations that both get dropped.

source_evidence:
  - kind: interview
    reference: operator walkthrough, 2026-07-24
    note: Captured the real sequence including the parts that are not written down.
  - kind: observation
    reference: last six published articles
    note: Confirmed scope creep and the missing artwork handoff recur.

notes: >
  Captured as-is for the pilot. Defects are intentional and load-bearing as
  test fixtures — see the header comment for the rule-to-defect mapping.
