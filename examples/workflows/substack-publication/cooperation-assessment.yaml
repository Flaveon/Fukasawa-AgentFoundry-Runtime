#
# PILOT - stage 4: cooperation assessment, one entry per step.
#
# Produced by the published decision table in
# docs/cooperation-classification-guide.md. No model was involved: the same
# workflow always yields these recommendations, floors and rationales.
#
# Read safety_floor first. A floor is a ceiling on autonomy imposed by a fact
# about the work - the effect cannot be undone, the data is sensitive, nobody
# owns the decision. A floored step can be overridden toward human control but
# never toward more autonomy, and that rule is enforced in code.
#
# Note publish-post: an agent may PREPARE the publication, but a human
# authorizes it, because sending to subscribers cannot be unsent. And
# review-and-approve stays HUMAN_ONLY - approving your own publication is not
# something to delegate.
#
# request-artwork carries a recorded human override, with the reason.

