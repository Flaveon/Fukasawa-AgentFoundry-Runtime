#
# Model endpoint configuration EXAMPLE. Copy to
# $FUKASAWA_HOME/model_endpoints.yaml (default ~/.fukasawa/model_endpoints.yaml)
# and replace the placeholder hosts below with your own.
#
# The values here are placeholders, not real hosts — put your actual
# addresses only in your local config, which is never committed.
#
# Graphs reference these by NAME, never by IP or model id — so a shared
# graph says `endpoint: gpu-node` and each operator's config decides what
# that resolves to. Entries here merge over the built-in localhost defaults.
#
# kind: ollama    -> POST {url}/api/chat            (Ollama servers)
# kind: llamacpp  -> POST {url}/v1/chat/completions (llama.cpp, OpenAI-compatible)

endpoints:
  # A local llama.cpp server on this machine.
  local-llama:
    kind: llamacpp
    url: http://localhost:8081

  # A local Ollama server on this machine.
  local-ollama:
    kind: ollama
    url: http://localhost:11434

  # An Ollama server elsewhere on your network. Replace the host with yours.
  gpu-node:
    kind: ollama
    url: http://YOUR-OLLAMA-HOST:11434
