#
# Test on Linux, then build the distributable executable on Linux, Windows,
# and macOS. PyInstaller does not cross-compile, so each binary is built on
# its own OS. Tagging v* attaches the three binaries to a GitHub Release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Provision Python 3.12
        run: uv python install 3.12

      - name: Create venv and install (dev + gui)
        run: |
          uv venv --python 3.12
          uv pip install -e '.[dev,gui]'

      - name: Install Xvfb (for headless GUI tests)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run the test suite
        # xvfb-run gives the GUI view tests a display; the rest run anyway.
        run: xvfb-run -a uv run pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: fukasawa-linux-x64
          - os: windows-latest
            asset: fukasawa-windows-x64.exe
          - os: macos-latest
            asset: fukasawa-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Provision Python 3.12
        run: uv python install 3.12

      - name: Create venv and install (build)
        run: |
          uv venv --python 3.12
          uv pip install -e '.[build]'

      - name: Build the executable
        run: uv run pyinstaller --clean --noconfirm packaging/fukasawa.spec

      - name: Smoke-test the bundle (CLI mode, no Python installed path)
        shell: bash
        run: |
          BIN=dist/fukasawa
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" validate brief examples/q2c-production-handoff.yaml

      - name: Name the artifact per platform
        shell: bash
        run: |
          SRC=dist/fukasawa
          [ -f "$SRC.exe" ] && SRC="$SRC.exe"
          cp "$SRC" "dist/${{ matrix.asset }}"

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built executables
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach binaries to the release
        # Untrusted-input safety: the tag name and repo slug are passed as
        # quoted env vars, never interpolated straight into the shell — a
        # maliciously-named tag cannot inject commands.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --generate-notes \
            artifacts/**/*
